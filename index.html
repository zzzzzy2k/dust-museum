<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="记录电子产品的最后使用时间和购买信息，实时计算吃灰天数，整理闲置价值与处置优先级。数据仅保存在本地浏览器。"
    />
    <meta name="theme-color" content="#f1f3f4" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23566c81'/%3E%3Cpath d='M9 13h14v11a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V13Z' fill='none' stroke='%23f7f9fa' stroke-width='1.8'/%3E%3Cpath d='M12 13v-2.2A1.8 1.8 0 0 1 13.8 9h4.4a1.8 1.8 0 0 1 1.8 1.8V13' fill='none' stroke='%23f7f9fa' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='19' r='1.2' fill='%23f7f9fa'/%3E%3C/svg%3E"
    />
    <title>吃灰台账 · 闲置设备记录</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("chixia-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
